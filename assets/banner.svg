<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="swam-toolkit — an unofficial toolkit to address and map SWAM instrument parameters">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a35"/>
      <stop offset="1" stop-color="#1c1030"/>
    </linearGradient>
    <linearGradient id="gM" gradientUnits="userSpaceOnUse" x1="70" y1="100" x2="256" y2="262">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gR" gradientUnits="userSpaceOnUse" x1="302" y1="0" x2="759" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect x="0" y="352" width="1280" height="8" fill="url(#gB)" opacity="0.85"/>

  <!-- what the repository is, said as a shape -->
  <g transform="translate(70,100)" opacity="0.95">
    <g fill="none" stroke="#2a3358" stroke-width="7" stroke-linecap="round">
      <path d="M8 12 h170"/><path d="M8 48 h170"/><path d="M8 84 h170"/>
      <path d="M8 120 h170"/><path d="M8 156 h170"/>
    </g>
    <g fill="none" stroke="url(#gM)" stroke-width="7" stroke-linecap="round">
      <path d="M8 12 h112"/><path d="M8 48 h58"/><path d="M8 84 h146"/>
      <path d="M8 120 h84"/><path d="M8 156 h36"/>
    </g>
    <g fill="#0b1020" stroke="url(#gM)" stroke-width="2.5">
      <circle cx="120" cy="12" r="9"/><circle cx="66" cy="48" r="9"/>
      <circle cx="146" cy="84" r="9"/><circle cx="92" cy="120" r="9"/>
      <circle cx="44" cy="156" r="9"/>
    </g>  </g>

  <!-- name, one-line subtitle, technical line -->
  <g transform="translate(300,162)">
    <text x="0" y="0" font-family="-apple-system, Segoe UI, sans-serif" font-size="68" font-weight="700" fill="#ffffff" letter-spacing="-0.5">swam-toolkit</text>
    <rect x="2" y="18" width="457" height="5" rx="2.5" fill="url(#gR)"/>
    <text x="2" y="70" font-family="-apple-system, Segoe UI, sans-serif" font-size="24" fill="#aab4d8">Address any SWAM parameter from the host side, and map the rest.</text>
    <text x="2" y="108" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7f8bb5">parameter-ID hash  ·  factory CC map  ·  state decoder  ·  .swamec generator</text>
  </g>
</svg>
